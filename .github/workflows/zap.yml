name: Security — ZAP + e2e

on:
  pull_request:
  workflow_dispatch:

jobs:
  zap:
    name: Lab e2e + ZAP API scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start test lab
        run: docker compose -f test/docker-compose.test.yml up -d --build --wait

      - name: E2E smoke (rd-a -> rd-b)
        run: python3 test/smoke.py | tee smoke.txt

      - name: ZAP API scan (OpenAPI of the server)
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:18080/openapi.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-report

      - name: Summary
        if: always()
        run: |
          {
            echo "### E2E smoke"; echo '```'; cat smoke.txt 2>/dev/null; echo '```'
            echo "### ZAP"; echo "Informe HTML/MD en el artefacto \`zap-api-report\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lab logs on failure
        if: failure()
        run: docker compose -f test/docker-compose.test.yml logs --tail=100

      - name: Stop lab
        if: always()
        run: docker compose -f test/docker-compose.test.yml down -v
